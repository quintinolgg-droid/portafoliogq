<app-nav></app-nav>

<div class="flex flex-col items-center mt-4 px-6 fade-up">
  <h2
    class="text-3xl md:text-4xl font-bold text-white text-center mb-8 tracking-wide"
  >
    <span class="text-cyan-400">Mi Formación</span> Académica
  </h2>

  <div
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10 max-w-6xl w-full justify-items-center my-4"
  >
    <div
      *ngFor="let item of edu"
      class="relative group bg-gradient-to-b from-[#111111] to-[#1b1b1b] border border-gray-800 rounded-3xl p-6 w-80 shadow-[0_0_15px_rgba(0,255,255,0.1)] transform transition-all duration-500 hover:scale-125 hover:shadow-[0_0_30px_rgba(0,255,255,0.5)] mt-2"
    >
      <div class="relative z-10 text-center">
        <h5 class="text-2xl font-bold text-cyan-400 mb-3">
          {{ item.Nombre }}
        </h5>
        <h6 class="text-gray-300 mb-4 font-semibold tracking-wide">
          {{ item.Grado }}
        </h6>
        <p class="text-gray-400 text-sm leading-relaxed text-justify">
          {{ item.Descripcion }}
        </p>
      </div>
    </div>
  </div>
</div>
