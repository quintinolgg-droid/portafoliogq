<app-nav></app-nav>
<div class="fade-up">
  <div #globeContainer class="w-full h-screen"></div>

  <!-- Modal Angular -->
  <div *ngIf="showModal" class="modal-backdrop">
    <div class="modal-card">
      <h1 class="text-3xl">
        <strong>Lenguaje: {{ selectedLenguaje?.Nombre }}</strong>
      </h1>
      <hr class="border-1" />
      <p class="mt-3">
        <strong>Años:</strong> {{ selectedLenguaje?.Anios }}
        <strong>Meses:</strong> {{ selectedLenguaje?.Meses }}
      </p>
      <hr class="border-1" />
      <p class="mt-3">
        <strong>Desarrollo y Ejecución de Proyectos</strong> <br />{{
          selectedLenguaje?.Descripcion
        }}
      </p>
      <button class="mt-4 btn btn-warning" (click)="closeModal()">
        Cerrar
      </button>
    </div>
  </div>
</div>
