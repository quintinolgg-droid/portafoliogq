<app-nav></app-nav>

<div class="fade-up flex justify-center items-center mt-5">
  <div
    id="carouselExample"
    class="carousel slide w-full max-w-3xl text-center"
    data-bs-ride="carousel"
  >
    <div class="carousel-inner overflow-visible">
      <div
        class="carousel-item transition-all duration-700 ease-in-out overflow-visible"
        [class.active]="i === 0"
        *ngFor="let item of experiencias; let i = index"
      >
        <div
          class="bg-gradient-to-b from-[#111111] to-[#1b1b1b] border border-gray-800 rounded-3xl p-10 w-[90%] sm:w-[80%] md:w-[70%] h-[420px] flex flex-col justify-center mx-auto shadow-[0_0_25px_rgba(0,255,255,0.2)] hover:shadow-[0_0_40px_rgba(0,255,255,0.6)] transform hover:scale-[1.03] transition-all duration-700"
        >
          <h3 class="text-2xl md:text-3xl font-bold text-cyan-400 mb-3">
            {{ item.Titulo }}
          </h3>

          <p class="text-gray-300 text-sm md:text-base mb-4 italic">
            <span class="font-semibold text-white">Duración:</span>
            {{ item.Anios }} año(s), {{ item.Meses }} mes(es)
          </p>

          <p
            class="text-gray-400 text-sm md:text-base leading-relaxed border-t border-gray-700 pt-3"
          >
            <span class="text-cyan-300 font-semibold">Herramientas:</span><br />
            {{ item.Herramientas }}
          </p>
        </div>
      </div>
    </div>

    <!-- Controles -->
    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#carouselExample"
      data-bs-slide="prev"
    >
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>

    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#carouselExample"
      data-bs-slide="next"
    >
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</div>
